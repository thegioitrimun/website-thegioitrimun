<!DOCTYPE html>
<html lang="vi" style="scroll-behavior: smooth;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/icons/logo-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/da-lieu-nhiet-doi-phu-quoc-48.png?v=clinic-20260906" id="favicon" />
  <link rel="shortcut icon" href="/favicon.ico?v=clinic-20260906" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>TGTM Workspace — Quản trị Thế Giới Trị Mụn</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />

  <!-- Admin Web App & PWA Support -->
  <link rel="manifest" href="/admin-manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/da-lieu-nhiet-doi-phu-quoc-180.png?v=clinic-20260906" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TGTM Admin" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // Set theme instantly on initial load, preventing FOUC
    (function () {
      const theme = localStorage.getItem('iskin-clinic-theme') || 'dark';
      const colorTheme = localStorage.getItem('iskin-clinic-color-theme') || 'vinmec';
      const root = document.documentElement;

      const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.toggle('dark', isDark);
      root.classList.add('theme-' + colorTheme);
    })();
    // Set font instantly
    (function () {
      const fontStacks = {
        'Be Vietnam Pro': '"Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Roboto': 'Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Open Sans': '"Open Sans", "Segoe UI", Arial, sans-serif',
        'Noto Sans': '"Noto Sans", "Segoe UI", Arial, sans-serif'
      };
      const font = localStorage.getItem('iskin-clinic-font') || 'Be Vietnam Pro';
      const resolvedFont = fontStacks[font] || fontStacks['Be Vietnam Pro'];
      document.documentElement.style.setProperty('--font-sans', resolvedFont);
      document.documentElement.style.setProperty('--font-heading', resolvedFont);
    })();
  </script>
</head>

<body class="bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary">
  <div id="admin-root"></div>
  <script type="module" src="/admin/main.tsx"></script>
</body>

</html>
