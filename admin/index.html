<!DOCTYPE html>
<html lang="vi" class="bg-background dark:bg-[#0b0f17]" style="background-color: #0b0f17;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/admin-logo-dark.svg?v=admin-20260911" media="(prefers-color-scheme: dark)" id="svg-favicon-dark" />
  <link rel="icon" type="image/svg+xml" href="/icons/admin-logo.svg?v=admin-20260911" media="(prefers-color-scheme: light)" id="svg-favicon-light" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/admin-pwa-dark-48.png?v=admin-20260911" media="(prefers-color-scheme: dark)" id="favicon-dark" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/admin-pwa-48.png?v=admin-20260911" media="(prefers-color-scheme: light)" id="favicon-light" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/admin-pwa-dark-32.png?v=admin-20260911" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/admin-pwa-32.png?v=admin-20260911" media="(prefers-color-scheme: light)" />
  <link rel="shortcut icon" href="/admin-favicon.ico?v=admin-20260911" id="shortcut-favicon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TGTM Workspace — Quản trị Thế Giới Trị Mụn</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />

  <!-- Admin Web App & PWA Support -->
  <link rel="manifest" href="/admin-manifest.json" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0b0f17" id="theme-color-meta" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/admin-pwa-dark-180.png?v=admin-20260911" id="apple-touch-icon" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TGTM Admin" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // Detect standalone PWA mode and set theme instantly on initial load, preventing FOUC
    (function () {
      const isStandalonePWA = window.matchMedia('(display-mode: standalone)').matches ||
                              window.matchMedia('(display-mode: fullscreen)').matches ||
                              window.matchMedia('(display-mode: minimal-ui)').matches ||
                              Boolean('standalone' in window.navigator && window.navigator.standalone);

      const theme = localStorage.getItem('iskin-clinic-theme') || 'dark';
      const colorTheme = localStorage.getItem('iskin-clinic-color-theme') || 'vinmec';
      const root = document.documentElement;

      if (isStandalonePWA) {
        root.classList.add('is-pwa');
      }

      const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.toggle('dark', isDark);
      root.classList.add('theme-' + colorTheme);
      root.style.backgroundColor = isDark ? '#0b0f17' : '#ffffff';

      const themeMeta = document.getElementById('theme-color-meta');
      if (themeMeta) {
        themeMeta.setAttribute('content', isDark ? '#0b0f17' : '#ffffff');
      }

      const appleTouchIcon = document.getElementById('apple-touch-icon');
      if (appleTouchIcon) {
        appleTouchIcon.setAttribute('href', isDark ? '/icons/admin-pwa-dark-180.png?v=admin-20260911' : '/icons/admin-pwa-180.png?v=admin-20260911');
      }
    })();
    // Set font instantly
    (function () {
      const fontStacks = {
        'Be Vietnam Pro': '"Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Roboto': 'Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Open Sans': '"Open Sans", "Segoe UI", Arial, sans-serif',
        'Noto Sans': '"Noto Sans", "Segoe UI", Arial, sans-serif'
      };
      const font = localStorage.getItem('iskin-clinic-font') || 'Be Vietnam Pro';
      const resolvedFont = fontStacks[font] || fontStacks['Be Vietnam Pro'];
      document.documentElement.style.setProperty('--font-sans', resolvedFont);
      document.documentElement.style.setProperty('--font-heading', resolvedFont);
    })();
  </script>
</head>

<body class="bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary">
  <div id="admin-root"></div>
  <script type="module" src="/admin/main.tsx"></script>
</body>

</html>
