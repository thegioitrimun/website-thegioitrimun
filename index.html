  <script>
    (function () {
      const normalizedPath = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      const shouldPreloadHero = normalizedPath === '/';
      if (!shouldPreloadHero) return;

      const heroPreloads = [
        { href: '/hero/hero-mobile-v2.avif', media: '(max-width: 639px)' },
        { href: '/hero/hero-tablet-v2.avif', media: '(min-width: 640px) and (max-width: 767px)' },
        { href: '/hero/hero-desktop-v2.avif', media: '(min-width: 768px)' },
      ];

      heroPreloads.forEach(({ href, media }) => {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = href;
        link.media = media;
        link.type = 'image/avif';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      });
    })();
  </script>
  <script>
    // IIFE to set theme instantly, preventing FOUC
    (function () {
      const theme = localStorage.getItem('iskin-clinic-theme') || 'light';
      const colorTheme = localStorage.getItem('iskin-clinic-color-theme') || 'teal';
      const root = document.documentElement;

      const isDark = theme === 'dark';
      root.classList.toggle('dark', isDark);
      root.classList.add(`theme-${colorTheme}`);
    })();
    // IIFE to set font instantly, preventing FOUC
    (function () {
      const fontStacks = {
        'Be Vietnam Pro': '"Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Roboto': 'Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif',
        'Open Sans': '"Open Sans", "Segoe UI", Arial, sans-serif',
        'Noto Sans': '"Noto Sans", "Segoe UI", Arial, sans-serif'
      };
      const font = localStorage.getItem('iskin-clinic-font') || 'Open Sans';
      const resolvedFont = fontStacks[font] || fontStacks['Open Sans'];
      document.documentElement.style.setProperty('--font-sans', resolvedFont);
      document.documentElement.style.setProperty('--font-heading', resolvedFont);
    })();
  </script>
